name: Python and browser validation

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[dev]'

    - name: Run Pytest Suite
      run: |
        pytest -q
        python -m compileall -q agents intent_stack cli.py enrichment.py simulator.py
        python -m pip check

    - name: Browser JavaScript syntax check
      run: |
        python - <<'PY'
        import re
        from pathlib import Path
        page = Path("web/index.html").read_text(encoding="utf-8")
        scripts = re.findall(r"<script>(.*?)</script>", page, re.S)
        assert len(scripts) == 1, "Expected one inline browser script"
        Path("/tmp/dialogue-intent-web.js").write_text(scripts[0], encoding="utf-8")
        PY
        node --check /tmp/dialogue-intent-web.js
        node tests/browser-smoke.js

    - name: Audit integrity smoke check
      run: |
        python - <<'PY'
        from agents.base import AuditTrail
        trail = AuditTrail(secret_key="ci-test-only-key")
        trail.log("ci", "test", "SMOKE", {"status": "PASS"})
        assert trail.verify_integrity()
        trail.logs[0]["payload_hash"] = "altered"
        assert not trail.verify_integrity()
        PY
